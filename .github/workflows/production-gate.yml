name: Production Gate (develop)

# Sprint 13.1 — the tests/build gate for durable production deployment.
# Render (render.yaml, autoDeployTrigger=checksPass) deploys a develop commit
# only after this workflow succeeds, so a red gate never replaces a healthy
# production deployment. No deployment secrets live here or in the repo.

permissions:
  contents: read
  actions: write
  checks: write

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  POSTGRES_ONLY: "true"
  REDIS_REQUIRED: "false"
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_ecosystem
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_ecosystem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_ecosystem"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations (single head, clean upgrade)
        run: |
          python -m alembic upgrade head
          HEADS=$(python -m alembic heads | grep -c "(head)")
          echo "alembic head count: $HEADS"
          test "$HEADS" -eq 1
      - name: Production health / readiness tests (Sprint 13/13.1/14)
        run: python -m pytest tests/test_production_health_sprint_13.py tests/test_sprint_13_1_durable_deployment.py tests/test_sprint_14_production_verification.py -q
      - name: CRM regression suites (Sprints 8-13)
        run: |
          python -m pytest \
            tests/test_auto_marketplace_crm_automation.py \
            tests/test_auto_marketplace_crm_communications.py \
            tests/test_auto_marketplace_crm_customer_360.py \
            tests/test_auto_marketplace_crm_execution.py \
            tests/test_auto_marketplace_crm_intelligence.py \
            tests/test_auto_marketplace_crm_lifecycle.py \
            tests/test_auto_marketplace_crm_metrics.py \
            tests/test_auto_marketplace_crm_postgres.py \
            tests/test_auto_marketplace_crm_workflow.py \
            tests/test_auto_marketplace_crm_manager_forecasting.py \
            tests/test_crm_api_security_40_1.py \
            tests/test_crm_engine.py \
            tests/test_crm_foundation_40_2.py \
            tests/test_casino_foundation.py \
            tests/test_casino_premium.py \
            tests/test_casino_immersive.py \
            tests/test_casino_world.py -q
      - name: Security suite
        run: |
          python -m pytest tests/test_management_security.py \
            tests/test_api_v1_freeze.py \
            tests/test_admin_security.py -q --tb=no
      - name: Vanguard / Recruiting hardening (Sprint 1.4)
        run: |
          python -m pytest \
            tests/test_sprint_recruiting_1_0.py \
            tests/test_sprint_vanguard_ingest_1_1.py \
            tests/test_sprint_recruiting_1_2_projects.py \
            tests/test_sprint_vanguard_live_1_3.py \
            tests/test_sprint_vanguard_hardening_1_4.py \
            tests/test_sprint_recruiting_1_5_ads.py \
            tests/test_sprint_recruiting_1_6_infra.py -q --tb=short
      - name: Alembic single head (re-check)
        run: |
          HEADS=$(python -m alembic heads | grep -c "(head)")
          echo "alembic head count: $HEADS"
          test "$HEADS" -eq 1
      - name: Production entrypoint import sanity
        run: python -c "import scripts.run_production_web, api.server, startup; print('ok')"

  web-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (report-only — known pre-existing failures in unrelated verticals)
        run: npm run lint
        continue-on-error: true
      - name: Vanguard / Recruiting vitest (scoped)
        run: npx vitest run src/vanguard/vanguardCareer.test.tsx workspace/recruiting/sprint_recruiting_1_0.test.tsx workspace/recruiting/sprint_recruiting_1_2.test.tsx workspace/recruiting/sprint_recruiting_1_5.test.tsx workspace/recruiting/sprint_recruiting_1_6.test.tsx
      - name: Production build (blocking)
        run: npx vite build

  vanguard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_ecosystem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_ecosystem"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: development
      PYTHON: python3
      VANGUARD_ANTIBOT_PROVIDER: none
      VANGUARD_APPLY_RATE_LIMIT: "50"
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Wait for Postgres and Redis
        run: python3 scripts/ci_wait_tcp.py 5432 6379
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: npm ci --no-audit --no-fund
        working-directory: src/web
      - run: npx playwright install --with-deps chromium
        working-directory: src/web
      - name: Playwright Vanguard E2E
        working-directory: src/web
        env:
          CI: "true"
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_ecosystem
          REDIS_URL: redis://localhost:6379/0
          REDIS_REQUIRED: "false"
          VANGUARD_ANTIBOT_PROVIDER: none
          VANGUARD_APPLY_RATE_LIMIT: "50"
          PYTHON: python3
        run: npx playwright test --config=playwright.config.ts
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-e2e-report
          path: |
            src/web/playwright-report
            src/web/test-results
          if-no-files-found: ignore
