# Production docker-compose — bot + postgres + redis + nginx + prometheus + grafana
# Durable production path (Sprint 13.1). Cloudflare Quick Tunnels are NOT production.
# Sprint 30.9 Beta Hardening: no default Grafana/Postgres passwords in production.
#
# Required: copy .env.example → .env.production (gitignored) and replace CHANGE_ME.
# Deploy: ./scripts/deploy_production.sh
# Doctor: python scripts/production_doctor.py --offline
# Postgres is not published to the host.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_ecosystem}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # From .env.production via: docker compose --env-file .env.production ...
      # Default matches .env.production placeholder (Compose does not auto-load that file).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_ecosystem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      SOURCE_REVISION: ${GIT_SHA:-unknown}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - media_cache:/app/data/media_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/web/dist:/usr/share/nginx/html:ro
      # Mount TLS certs when available:
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      bot:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    # Values for the container come from .env.production (Compose does not use
    # service env_file for ${VAR} interpolation — only `.env` / --env-file / shell).
    env_file:
      - .env.production
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ados_admin}
      # Prefer GRAFANA_ADMIN_PASSWORD when provided via --env-file .env.production
      # or shell; otherwise use the same placeholder as in .env.production.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  media_cache:
  prometheus_data:
  grafana_data:
